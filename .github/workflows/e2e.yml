name: E2E

# Reused by ci.yml as a required PR check and available on demand for any branch.

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      - name: Prepare env file
        run: cp apps/web/.env.example apps/web/.env.local

      - name: Install Playwright browsers
        run: bun web test:install

      - name: Run Playwright tests
        run: bun web test:ci

      - name: Save Playwright report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          retention-days: 7
