<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-label="A large Accept all button under a mouse cursor that clicks it again and again, beside three bars, docs I read, diffs I read, and ideas of my own, that drain toward empty" role="img" viewBox="0 0 1200 630"><style>.c{animation:c 2.4s ease-in-out infinite}.r{transform-box:fill-box;transform-origin:center;animation:r 2.4s ease-out infinite}.b{transform-box:fill-box;transform-origin:0 50%;animation:b 7s ease-in-out infinite alternate}.b2{animation-delay:.6s}.b3{animation-delay:1.2s}@keyframes c{0%,40%,100%{transform:translate(0,0)}50%{transform:translate(-3px,4px)}60%{transform:translate(0,0)}}@keyframes r{0%,48%{transform:scale(.2);opacity:0}52%{opacity:.6}90%,100%{transform:scale(1.6);opacity:0}}@keyframes b{0%,15%{transform:scaleX(1)}85%,100%{transform:scaleX(.12)}}@media (prefers-reduced-motion:reduce){.c,.r,.b{animation:none}.b{transform:scaleX(.12)}}</style><rect width="1200" height="630" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><text x="96" y="150" font-size="26" font-weight="600" letter-spacing="1">› apply 14 changes?</text><rect width="440" height="120" x="96" y="196" fill="#D7001A" fill-opacity=".08" stroke="#D7001A" stroke-width="4" rx="20"/><text x="316" y="272" fill="#D7001A" font-size="44" font-weight="700" letter-spacing="3" text-anchor="middle">ACCEPT ALL</text><rect width="440" height="84" x="96" y="346" fill="none" stroke="#78788a" stroke-dasharray="10 9" stroke-opacity=".5" stroke-width="4" rx="18"/><text x="316" y="398" fill-opacity=".45" font-size="28" font-weight="600" letter-spacing="2" text-anchor="middle">REVIEW</text><circle class="r" cx="470" cy="282" r="34" fill="none" stroke="#D7001A" stroke-width="4"/><g transform="translate(468 280)"><g class="c"><path fill="#78788a" stroke="#f4f4f6" stroke-linejoin="round" stroke-width="3" d="M0 0v52l13-12 9 21 10-4-9-20h18z"/></g></g><g font-size="22" font-weight="600" letter-spacing="1.5"><text x="660" y="176">DOCS I READ</text><text x="660" y="296">DIFFS I READ</text><text x="660" y="416">IDEAS OF MY OWN</text></g><g fill-opacity=".14"><rect width="444" height="28" x="660" y="196" rx="14"/><rect width="444" height="28" x="660" y="316" rx="14"/><rect width="444" height="28" x="660" y="436" rx="14"/></g><g fill-opacity=".6"><rect class="b" width="444" height="28" x="660" y="196" rx="14"/><rect class="b b2" width="444" height="28" x="660" y="316" rx="14"/><rect class="b b3" width="444" height="28" x="660" y="436" fill="#D7001A" fill-opacity="1" rx="14"/></g></g><rect width="1008" height="1" x="96" y="520" fill="#78788a" fill-opacity=".3"/></svg>
