<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-label="Five bars. AI writes or assists 42 percent of the code developers commit, and only 48 percent always check it first, per Sonar. 80 percent of organizations adopted AI faster than they wrote policy, and 43 percent cannot tell AI code from human code, per GitLab. Only 45 percent of leaders have evidence that traces AI to code changes, per Qodo." role="img" viewBox="0 0 1200 640"><style>.g{transform-box:fill-box;transform-origin:0 50%;animation:g 8s ease-out infinite}.g0{animation-delay:0.0s}.g1{animation-delay:0.25s}.g2{animation-delay:0.5s}.g3{animation-delay:0.75s}.g4{animation-delay:1.0s}@keyframes g{0%{transform:scaleX(0)}25%,90%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="640" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><text x="96" y="84" font-size="24" letter-spacing="2">AI CODE IN 2026, BY THE NUMBERS</text><text x="96" y="140" font-size="18" letter-spacing="1">AI WRITES OR ASSISTS THE CODE WE COMMIT</text><text x="1104" y="140" font-size="16" letter-spacing="1" text-anchor="end" fill-opacity=".55">SONAR</text><rect width="867" height="26" x="96" y="154" fill-opacity=".12" rx="13"/><rect class="g g0" width="364" height="26" x="96" y="154" fill="#78788a" fill-opacity="0.6" rx="13"/><text x="1104" y="176" font-size="26" text-anchor="end" fill="#78788a">42%</text><text x="96" y="236" font-size="18" letter-spacing="1">DEVELOPERS WHO ALWAYS CHECK IT FIRST</text><text x="1104" y="236" font-size="16" letter-spacing="1" text-anchor="end" fill-opacity=".55">SONAR</text><rect width="867" height="26" x="96" y="250" fill-opacity=".12" rx="13"/><rect class="g g1" width="416" height="26" x="96" y="250" fill="#D7001A" fill-opacity="1" rx="13"/><text x="1104" y="272" font-size="26" text-anchor="end" fill="#D7001A">48%</text><text x="96" y="332" font-size="18" letter-spacing="1">ORGS THAT ADOPTED AI FASTER THAN POLICY</text><text x="1104" y="332" font-size="16" letter-spacing="1" text-anchor="end" fill-opacity=".55">GITLAB</text><rect width="867" height="26" x="96" y="346" fill-opacity=".12" rx="13"/><rect class="g g2" width="694" height="26" x="96" y="346" fill="#78788a" fill-opacity="0.6" rx="13"/><text x="1104" y="368" font-size="26" text-anchor="end" fill="#78788a">80%</text><text x="96" y="428" font-size="18" letter-spacing="1">CANNOT TELL AI CODE FROM HUMAN CODE</text><text x="1104" y="428" font-size="16" letter-spacing="1" text-anchor="end" fill-opacity=".55">GITLAB</text><rect width="867" height="26" x="96" y="442" fill-opacity=".12" rx="13"/><rect class="g g3" width="373" height="26" x="96" y="442" fill="#78788a" fill-opacity="0.6" rx="13"/><text x="1104" y="464" font-size="26" text-anchor="end" fill="#78788a">43%</text><text x="96" y="524" font-size="18" letter-spacing="1">LEADERS WITH EVIDENCE TRACING AI TO CODE</text><text x="1104" y="524" font-size="16" letter-spacing="1" text-anchor="end" fill-opacity=".55">QODO</text><rect width="867" height="26" x="96" y="538" fill-opacity=".12" rx="13"/><rect class="g g4" width="390" height="26" x="96" y="538" fill="#D7001A" fill-opacity="1" rx="13"/><text x="1104" y="560" font-size="26" text-anchor="end" fill="#D7001A">45%</text></g></svg>
