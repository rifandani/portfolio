<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" aria-label="GitLab's three questions about any change, each linked to where my company's checks answer it: where did it come from, in the MR record; what was it meant to do, in the impact field; who is responsible, in the ticked checklist." role="img" viewBox="0 0 1200 600"><style>.f{animation:f 1.2s linear infinite}@keyframes f{to{stroke-dashoffset:-26}}.h{animation:h 6s infinite}.h1{animation-delay:1s}.h2{animation-delay:2s}@keyframes h{0%,8%{fill-opacity:.1}14%,60%{fill-opacity:.9}70%,100%{fill-opacity:.1}}.ht{animation:ht 6s infinite}.ht1{animation-delay:1s}.ht2{animation-delay:2s}@keyframes ht{0%,8%{fill:#78788a}14%,60%{fill:#fff}70%,100%{fill:#78788a}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="600" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><text x="96" y="84" font-size="22" letter-spacing="2">GITLAB'S THREE QUESTIONS</text><text x="1104" y="84" font-size="22" letter-spacing="2" text-anchor="end" fill="#D7001A">WHERE THE ANSWER LIVES</text><rect width="420" height="96" x="96" y="130" fill="none" stroke="#78788a" stroke-width="4" rx="16"/><text x="306" y="185" font-size="20" text-anchor="middle">WHERE DID IT COME FROM?</text><path class="f" fill="none" stroke="#D7001A" stroke-dasharray="8 18" stroke-linecap="round" stroke-width="4" d="M528 178h132"/><rect class="h h0" width="420" height="96" x="684" y="130" fill="#D7001A" stroke="#D7001A" stroke-width="4" rx="16"/><text class="ht ht0" x="894" y="185" font-size="20" text-anchor="middle">THE MR RECORD</text><rect width="420" height="96" x="96" y="280" fill="none" stroke="#78788a" stroke-width="4" rx="16"/><text x="306" y="335" font-size="20" text-anchor="middle">WHAT WAS IT MEANT TO DO?</text><path class="f" fill="none" stroke="#D7001A" stroke-dasharray="8 18" stroke-linecap="round" stroke-width="4" d="M528 328h132"/><rect class="h h1" width="420" height="96" x="684" y="280" fill="#D7001A" stroke="#D7001A" stroke-width="4" rx="16"/><text class="ht ht1" x="894" y="335" font-size="20" text-anchor="middle">THE IMPACT FIELD</text><rect width="420" height="96" x="96" y="430" fill="none" stroke="#78788a" stroke-width="4" rx="16"/><text x="306" y="485" font-size="20" text-anchor="middle">WHO IS RESPONSIBLE?</text><path class="f" fill="none" stroke="#D7001A" stroke-dasharray="8 18" stroke-linecap="round" stroke-width="4" d="M528 478h132"/><rect class="h h2" width="420" height="96" x="684" y="430" fill="#D7001A" stroke="#D7001A" stroke-width="4" rx="16"/><text class="ht ht2" x="894" y="485" font-size="20" text-anchor="middle">THE TICKED CHECKLIST</text></g></svg>
