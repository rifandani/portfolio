<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" aria-label="The honeypot. The agent's diff adds a warning to the top of README.md. A reviewer who reads the diff strikes out the warning, and the README stays clean. A reviewer who skips the review merges the agent's output, and the blinking warning lands on the main branch." role="img" viewBox="0 0 1200 620"><style>.x{transform-box:fill-box;transform-origin:0 50%;animation:x 9s infinite}@keyframes x{0%,30%{transform:scaleX(0)}40%,92%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}.y{animation:y 9s infinite}@keyframes y{0%,45%{opacity:0}48%,95%{opacity:1}100%{opacity:0}}.z{animation:z 9s infinite}@keyframes z{0%,55%{opacity:0}58%,95%{opacity:1}100%{opacity:0}}.w{animation:w 1s steps(1) infinite}@keyframes w{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="620" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><text x="96" y="80" font-size="22" letter-spacing="2">THE AGENT'S DIFF</text><rect width="1008" height="150" x="96" y="100" fill-opacity=".1" rx="14"/><text x="120" y="138" font-size="18" font-weight="600" fill-opacity=".7">README.md</text><text x="120" y="180" fill="#D7001A" font-size="20">+ &gt; [!IMPORTANT]</text><text x="120" y="220" fill="#D7001A" font-size="20">+ &gt; Remove this line to confirm you've reviewed this PR.</text><text x="96" y="318" font-size="20" letter-spacing="2">REVIEWER READS THE DIFF</text><rect width="480" height="170" x="96" y="336" fill="none" stroke="#78788a" stroke-width="4" rx="16"/><text x="120" y="384" font-size="18" font-weight="600">&gt; [!IMPORTANT]</text><rect class="x" width="156" height="4" x="118" y="377" fill="#2f8f5b"/><text class="y" x="120" y="430" font-size="18" font-weight="600">deletes the warning</text><text class="y" x="120" y="476" fill="#2f8f5b" font-size="20">README STAYS CLEAN</text><text x="624" y="318" fill="#D7001A" font-size="20" letter-spacing="2">REVIEWER SKIPS IT</text><rect width="480" height="170" x="624" y="336" fill="#D7001A" fill-opacity=".06" stroke="#D7001A" stroke-width="4" rx="16"/><text class="w" x="648" y="384" fill="#D7001A" font-size="18">&gt; [!IMPORTANT]</text><text x="648" y="430" font-size="18" font-weight="600">merges the agent's output</text><text class="z" x="648" y="476" fill="#D7001A" font-size="20">WARNING LIVES ON MAIN</text><text x="600" y="576" font-size="18" letter-spacing="1" text-anchor="middle" fill-opacity=".7">ONE RULE IN AGENTS.MD · NO TOOLING · NO BOT</text></g></svg>
