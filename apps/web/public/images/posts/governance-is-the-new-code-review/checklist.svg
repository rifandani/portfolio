<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" aria-label="A merge request with the Engineer Checklist. The author ticks the first two boxes, leaves the third empty, and merges anyway. After the merge, the post-merge assessment records the empty box and stamps the author as a non-compliant engineer." role="img" viewBox="0 0 1200 600"><style>.a{animation:a 10s infinite}.b{animation:b 10s infinite}.c{animation:c 10s infinite}.d{animation:d 10s infinite}.e{animation:e 10s infinite}.o{animation:o 10s infinite}@keyframes a{0%,10%{opacity:0}13%,95%{opacity:1}100%{opacity:0}}@keyframes b{0%,22%{opacity:0}25%,95%{opacity:1}100%{opacity:0}}@keyframes c{0%,42%{opacity:0}45%,95%{opacity:1}100%{opacity:0}}@keyframes d{0%,58%{opacity:0}61%,95%{opacity:1}100%{opacity:0}}@keyframes e{0%,70%{opacity:0}73%,95%{opacity:1}100%{opacity:0}}@keyframes o{0%,42%{opacity:1}45%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.o{opacity:0}}</style><rect width="1200" height="600" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><text x="96" y="90" font-size="26">!482 · Add refund flow</text><g class="o"><rect width="120" height="40" x="984" y="62" fill="none" stroke="#78788a" stroke-width="3" rx="20"/><text x="1044" y="89" font-size="18" text-anchor="middle">OPEN</text></g><g class="c"><rect width="120" height="40" x="984" y="62" fill="#78788a" rx="20"/><text x="1044" y="89" fill="#fff" font-size="18" text-anchor="middle">MERGED</text></g><rect width="1008" height="1" x="96" y="122" fill-opacity=".3"/><text x="96" y="176" font-size="20" letter-spacing="2">ENGINEER CHECKLIST</text><rect width="40" height="40" x="96" y="200" fill="none" stroke="#78788a" stroke-width="4" rx="8"/><path class="a" fill="none" stroke="#78788a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M105 220l8 8 15-16"/><text x="160" y="227" font-size="19" font-weight="600">I understand the business context and implemented correctly</text><rect width="40" height="40" x="96" y="270" fill="none" stroke="#78788a" stroke-width="4" rx="8"/><path class="b" fill="none" stroke="#78788a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M105 290l8 8 15-16"/><text x="160" y="297" font-size="19" font-weight="600">I have tested my changes thoroughly and verified functionality</text><rect width="40" height="40" x="96" y="340" fill="none" stroke="#78788a" stroke-width="4" rx="8" stroke-dasharray="8 7"/><text x="160" y="367" font-size="19" font-weight="600" fill-opacity=".6">I have considered impact on existing systems and users</text><rect width="1008" height="1" x="96" y="438" fill-opacity=".3"/><g class="d"><text x="96" y="500" font-size="20" letter-spacing="2">POST-MERGE ASSESSMENT</text><text x="96" y="540" font-size="18" font-weight="600" fill-opacity=".7">Box 3 empty · result recorded</text></g><g class="e" transform="rotate(-5 900 512)"><rect width="340" height="84" x="730" y="470" fill="#D7001A" fill-opacity=".08" stroke="#D7001A" stroke-width="4" rx="12"/><text x="900" y="503" fill="#D7001A" font-size="22" letter-spacing="2" text-anchor="middle">NON-COMPLIANT</text><text x="900" y="535" fill="#D7001A" font-size="22" letter-spacing="2" text-anchor="middle">ENGINEER</text></g></g></svg>
