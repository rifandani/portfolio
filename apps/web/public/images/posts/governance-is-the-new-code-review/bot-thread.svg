<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" aria-label="A bot thread in a merge request. The compliance bot asks for test evidence and impact. The author fills in both: twelve end-to-end tests passed with a screenshot, and the change touches only the payments API with a new Refund button for users. The merge button changes from blocked to ready." role="img" viewBox="0 0 1200 680"><style>.p{animation:p 10s infinite}.q{animation:q 10s infinite}.r{animation:r 10s infinite}.s{animation:s 10s infinite}.t{animation:t 10s infinite}.k{animation:k 10s infinite}@keyframes p{0%,15%{opacity:0}18%,95%{opacity:1}100%{opacity:0}}@keyframes q{0%,28%{opacity:0}31%,95%{opacity:1}100%{opacity:0}}@keyframes r{0%,42%{opacity:0}45%,95%{opacity:1}100%{opacity:0}}@keyframes s{0%,55%{opacity:0}58%,95%{opacity:1}100%{opacity:0}}@keyframes t{0%,70%{opacity:0}73%,95%{opacity:1}100%{opacity:0}}@keyframes k{0%,70%{opacity:1}73%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.k{opacity:0}}</style><rect width="1200" height="680" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><circle cx="124" cy="96" r="28" fill-opacity=".45"/><rect width="24" height="14" x="112" y="89" fill="#808088" rx="4"/><text x="170" y="92" font-size="22">compliance-bot</text><text x="170" y="120" font-size="17" font-weight="600" fill-opacity=".6">pipeline job · deterministic</text><text x="96" y="186" font-size="21" font-weight="600">Reply to this thread before you merge.</text><text x="96" y="250" font-size="20" letter-spacing="2">TEST EVIDENCE</text><rect width="1008" height="110" x="96" y="266" fill-opacity=".1" rx="14"/><text class="p" x="120" y="308" font-size="19" font-weight="600">e2e: refund.spec.ts <tspan fill="#2f8f5b">12 passed</tspan></text><text class="q" x="120" y="346" font-size="19" font-weight="600">screenshot: refund-success.png attached</text><text x="96" y="428" font-size="20" letter-spacing="2">IMPACT</text><rect width="1008" height="110" x="96" y="444" fill-opacity=".1" rx="14"/><text class="r" x="120" y="486" font-size="19" font-weight="600">Payments API v2 only. No schema change.</text><text class="s" x="120" y="524" font-size="19" font-weight="600">Users see a new Refund button on paid orders.</text><g class="k"><rect width="420" height="56" x="96" y="586" fill="none" stroke="#D7001A" stroke-width="3" stroke-dasharray="10 8" rx="12"/><text x="306" y="621" fill="#D7001A" font-size="20" text-anchor="middle">MERGE BLOCKED</text></g><g class="t"><rect width="420" height="56" x="96" y="586" fill="#2f8f5b" rx="12"/><text x="306" y="621" fill="#fff" font-size="20" text-anchor="middle">READY TO MERGE</text></g><text x="1104" y="621" font-size="17" font-weight="600" text-anchor="end" fill-opacity=".6">answers stay in the MR</text></g></svg>
