<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" aria-label="Two groups of twelve story ideas drawn as dots. Writers alone spread their ideas wide. Writers with AI ideas start just as wide, then their dots slide together into one tight cluster: each story gets better, but all of them look alike." role="img" viewBox="0 0 1200 620"><style>.m{animation:m 7s ease-in-out infinite alternate}.g{transform-box:fill-box;transform-origin:center;animation:g 7s ease-in-out infinite alternate}@keyframes m{0%,20%{transform:translate(0,0)}80%,100%{transform:translate(var(--x),var(--y))}}@keyframes g{0%,20%{transform:scale(1)}80%,100%{transform:scale(.36)}}@media (prefers-reduced-motion:reduce){.m,.g{animation:none}.m{transform:translate(var(--x),var(--y))}.g{transform:scale(.36)}}</style><rect width="1200" height="620" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><text x="96" y="96" font-size="24" letter-spacing="2">WRITERS ALONE</text><text x="640" y="96" font-size="24" letter-spacing="2" fill="#D7001A">WRITERS WITH AI IDEAS</text><rect width="1" height="440" x="600" y="80" fill-opacity=".3"/><ellipse cx="328" cy="330" fill="none" stroke="#78788a" stroke-dasharray="10 10" stroke-opacity=".5" stroke-width="3" rx="250" ry="200"/><ellipse class="g" cx="872" cy="330" fill="none" stroke="#D7001A" stroke-dasharray="10 10" stroke-opacity=".7" stroke-width="3" rx="250" ry="200"/><circle cx="136" cy="200" r="11"/><circle cx="276" cy="170" r="11"/><circle cx="426" cy="220" r="11"/><circle cx="516" cy="180" r="11"/><circle cx="186" cy="340" r="11"/><circle cx="346" cy="310" r="11" fill="#D7001A"/><circle cx="496" cy="360" r="11"/><circle cx="126" cy="470" r="11"/><circle cx="256" cy="440" r="11"/><circle cx="396" cy="490" r="11"/><circle cx="526" cy="460" r="11"/><circle cx="316" cy="390" r="11"/><circle class="m" style="--x:162px;--y:110px" cx="680" cy="200" r="11"/><circle class="m" style="--x:52px;--y:120px" cx="820" cy="170" r="11"/><circle class="m" style="--x:-68px;--y:85px" cx="970" cy="220" r="11"/><circle class="m" style="--x:-143px;--y:155px" cx="1060" cy="180" r="11"/><circle class="m" style="--x:97px;--y:0px" cx="730" cy="340" r="11"/><circle class="m" style="--x:-28px;--y:20px" cx="890" cy="310" r="11" fill="#D7001A"/><circle class="m" style="--x:-148px;--y:-10px" cx="1040" cy="360" r="11"/><circle class="m" style="--x:167px;--y:-100px" cx="670" cy="470" r="11"/><circle class="m" style="--x:67px;--y:-75px" cx="800" cy="440" r="11"/><circle class="m" style="--x:-43px;--y:-115px" cx="940" cy="490" r="11"/><circle class="m" style="--x:-148px;--y:-95px" cx="1070" cy="460" r="11"/><circle class="m" style="--x:12px;--y:-45px" cx="860" cy="390" r="11"/><g font-size="18" letter-spacing="1.5" text-anchor="middle"><text x="328" y="572">EACH: GOOD · ALL: VARIED</text><text x="872" y="572" fill="#D7001A">EACH: BETTER · ALL: ALIKE</text></g></g></svg>
