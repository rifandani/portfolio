ng="1">AGENT DONE, NOBODY LOOKS</text><text class="k" x="1104" y="378" fill="#D7001A" font-size="18" letter-spacing="1" text-anchor="end">WHAT WAS I DOING?</text><rect width="1008" height="2" x="96" y="440" fill-opacity=".4"/><g fill-opacity=".6"><rect width="2" height="14" x="96" y="434"/><rect width="2" height="14" x="264" y="434"/><rect width="2" height="14" x="432" y="434"/><rect width="2" height="14" x="600" y="434"/><rect width="2" height="14" x="768" y="434"/><rect width="2" height="14" x="936" y="434"/><rect width="2" height="14" x="1102" y="434"/></g><g font-size="18" text-anchor="middle" fill-opacity=".7"><text x="97" y="476">0</text><text x="265" y="476">5</text><text x="433" y="476">10</text><text x="601" y="476">15</text><text x="769" y="476">20</text><text x="937" y="476">25</text><text x="1103" y="476">30 MIN</text></g><rect class="p" width="3" height="360" x="95" y="92" fill="#D7001A" fill-opacity=".6"/><text x="600" y="548" font-size="20" letter-spacing="1" text-anchor="middle" fill-opacity=".8">AGENT RUN: 5 MIN · TIME AWAY: 25 MIN</text></g></svg>
