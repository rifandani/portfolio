<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" aria-label="A dashed bubble labeled what the model has seen, full of grey dots that drift but never leave it. One red dot, a human, walks out through the edge of the bubble and becomes a new idea outside it." role="img" viewBox="0 0 1200 620"><style>.d{animation:d 2s linear infinite}.w{animation:w 5s ease-in-out infinite alternate}.w2{animation-duration:6.5s;animation-direction:alternate-reverse}.h{animation:h 7s ease-in-out infinite}.n{animation:n 7s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:-40}}@keyframes w{to{transform:translate(18px,-14px)}}@keyframes h{0%,10%{transform:translateX(0);opacity:1}60%,92%{transform:translateX(470px);opacity:1}100%{transform:translateX(470px);opacity:0}}@keyframes n{0%,55%{opacity:0}62%,92%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.d,.w,.h,.n{animation:none}.h{transform:translateX(470px)}}</style><rect width="1200" height="620" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><circle class="d" cx="440" cy="320" r="240" fill="#78788a" fill-opacity=".06" stroke="#78788a" stroke-dasharray="20 20" stroke-width="4"/><text x="440" y="160" font-size="22" letter-spacing="2" text-anchor="middle">WHAT THE MODEL</text><text x="440" y="190" font-size="22" letter-spacing="2" text-anchor="middle">HAS SEEN</text><g fill-opacity=".55"><g class="w"><circle cx="330" cy="260" r="12"/><circle cx="460" cy="250" r="12"/><circle cx="300" cy="380" r="12"/><circle cx="420" cy="430" r="12"/><circle cx="560" cy="400" r="12"/></g><g class="w w2"><circle cx="380" cy="320" r="12"/><circle cx="540" cy="300" r="12"/><circle cx="250" cy="310" r="12"/><circle cx="480" cy="480" r="12"/><circle cx="350" cy="470" r="12"/></g></g><g class="h"><circle cx="460" cy="350" r="16" fill="#D7001A"/><text x="460" y="414" fill="#D7001A" font-size="18" letter-spacing="1.5" text-anchor="middle">A HUMAN</text></g><g class="n"><circle cx="930" cy="350" r="34" fill="none" stroke="#D7001A" stroke-width="3"/><text x="930" y="276" fill="#D7001A" font-size="22" letter-spacing="2" text-anchor="middle">NEW IDEA</text></g><text x="930" y="520" font-size="18" letter-spacing="1.5" text-anchor="middle" fill-opacity=".7">AGENTS STAY INSIDE.</text><text x="930" y="548" font-size="18" letter-spacing="1.5" text-anchor="middle" fill-opacity=".7">PEOPLE CAN WALK OUT.</text></g></svg>
