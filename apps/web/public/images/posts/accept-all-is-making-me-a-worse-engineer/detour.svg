<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-label="Two routes from a question to an answer. With search, the route winds past a blog post, an RFC, a forum reply, and a better library, so I pick up four side findings. With an agent, the route is a straight line, I say ok, use it, and I pick up nothing on the way." role="img" viewBox="0 0 1200 640"><style>.m{offset-path:path("M120 220C200 220 250 150 330 150S450 280 530 280S650 150 730 150S850 280 930 280S1020 220 1080 220");offset-rotate:0deg;animation:m 8s ease-in-out infinite}.f{animation:f 8s ease-in-out infinite}.d{animation:d 1.2s linear infinite}.s{animation:s 8s infinite}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}@keyframes m{0%{offset-distance:0%}75%,100%{offset-distance:100%}}@keyframes f{0%{transform:translateX(0)}22%,100%{transform:translateX(960px)}}@keyframes d{to{stroke-dashoffset:-26}}@keyframes s{0%,16%{fill:#78788a}18%,97%{fill:#D7001A}}@keyframes s2{0%,32%{fill:#78788a}34%,97%{fill:#D7001A}}@keyframes s3{0%,48%{fill:#78788a}50%,97%{fill:#D7001A}}@keyframes s4{0%,64%{fill:#78788a}66%,97%{fill:#D7001A}}@media (prefers-reduced-motion:reduce){.m,.f,.d,.s{animation:none}.s{fill:#D7001A}}</style><rect width="1200" height="640" fill="#808088" fill-opacity=".1" rx="24"/><g fill="#78788a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700"><text x="96" y="72" font-size="24" letter-spacing="2">RESEARCH WITH SEARCH</text><text x="1104" y="72" fill="#D7001A" font-size="22" letter-spacing="1.5" text-anchor="end">SIDE FINDINGS: 4</text><path fill="none" stroke="#78788a" stroke-dasharray="8 18" stroke-linecap="round" stroke-width="4" d="M120 220C200 220 250 150 330 150S450 280 530 280S650 150 730 150S850 280 930 280S1020 220 1080 220" class="d"/><g font-size="20" letter-spacing="1" text-anchor="middle"><text x="120" y="188">QUESTION</text><text x="1080" y="188">ANSWER</text><text x="330" y="124">BLOG POST</text><text x="530" y="320">RFC</text><text x="730" y="124">FORUM REPLY</text><text x="930" y="320">BETTER LIB</text></g><circle cx="120" cy="220" r="10" fill-opacity=".5"/><rect width="22" height="22" x="1069" y="209" fill-opacity=".5" rx="4"/><circle class="s" cx="330" cy="150" r="14"/><circle class="s s2" cx="530" cy="280" r="14"/><circle class="s s3" cx="730" cy="150" r="14"/><circle class="s s4" cx="930" cy="280" r="14"/><circle class="m" r="9"/><rect width="1008" height="1" x="96" y="372" fill-opacity=".3"/><text x="96" y="436" font-size="24" letter-spacing="2">RESEARCH WITH AN AGENT</text><text x="1104" y="436" font-size="22" letter-spacing="1.5" text-anchor="end" fill-opacity=".6">SIDE FINDINGS: 0</text><path fill="none" stroke="#78788a" stroke-dasharray="8 18" stroke-linecap="round" stroke-width="4" d="M120 540h960" class="d"/><g font-size="20" letter-spacing="1" text-anchor="middle"><text x="120" y="508">QUESTION</text><text x="1080" y="508">ANSWER</text><text x="600" y="590" fill="#D7001A">“OK, USE IT”</text></g><circle cx="120" cy="540" r="10" fill-opacity=".5"/><rect width="22" height="22" x="1069" y="529" fill-opacity=".5" rx="4"/><circle class="f" cx="120" cy="540" r="9"/></g></svg>
